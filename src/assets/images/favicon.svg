<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Gradiente Dourado Nobre -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Fundo Azul Oficial da Marca Aura Travel -->
    <linearGradient id="blueBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Sombra suave para a aeronave -->
    <filter id="planeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#07172b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Fundo Circular de Alto Contraste -->
  <circle cx="32" cy="32" r="30" fill="url(#blueBg)" />
  
  <!-- Borda dourada sutil -->
  <circle cx="32" cy="32" r="29.2" fill="none" stroke="url(#goldGrad)" stroke-width="1.6" opacity="0.85" />

  <!-- Órbita Dourada Tridimensional (Curva orbital de viagem internacional) -->
  <ellipse cx="32" cy="33" rx="23" ry="11" transform="rotate(-30 32 33)" fill="none" stroke="url(#goldGrad)" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="72 20" />

  <!-- Aeronave em Ascensão Rumo ao Destino (Super Nítida e Elegante) -->
  <g filter="url(#planeGlow)" transform="translate(32, 31) rotate(45) translate(-32, -32)">
    <!-- Fuselagem e Asas do Avião com Geometria Perfeita -->
    <path
      d="M 32 10
         C 33.2 10, 34.2 12, 34.5 16
         L 34.5 24
         L 54 32
         L 54 35.5
         L 34.5 31.5
         L 34.5 44
         L 41 49
         L 41 51.5
         L 32 49.5
         L 23 51.5
         L 23 49
         L 29.5 44
         L 29.5 31.5
         L 10 35.5
         L 10 32
         L 29.5 24
         L 29.5 16
         C 29.8 12, 30.8 10, 32 10 Z"
      fill="#ffffff"
    />
    <!-- Cabine de Piloto Aerodinâmica em Ciano Aéreo -->
    <path
      d="M 32 13
         C 32.5 13, 33 14, 33 16
         L 33 22
         L 31 22
         L 31 16
         C 31 14, 31.5 13, 32 13 Z"
      fill="#38bdf8"
    />
  </g>

  <!-- Ponto Estelar Dourado de Destino no Topo Direito -->
  <circle cx="50" cy="14" r="2.2" fill="url(#goldGrad)" />
</svg>